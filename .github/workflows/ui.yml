name: Screen checks
on:
  push:
    branches: [main]
    paths:
      - public/**
      - docs/**
      - scripts/test_app.cjs
      - scripts/test_download_page.cjs
      - scripts/serve.py
      - .github/workflows/ui.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check schedule and mobile screens
        run: |
          node scripts/test_timetable.cjs
          python3 scripts/serve.py > /tmp/rgatu-preview.log 2>&1 &
          node scripts/test_app.cjs
          node scripts/test_download_page.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-screens
          path: build/screenshots
          retention-days: 7

      - name: Archive reviewable phone screens
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          def api(endpoint,payload):
              result=subprocess.run(['gh','api','--method','POST',f'repos/{repo}/{endpoint}','--input','-'],input=json.dumps(payload),text=True,capture_output=True,check=True)
              return json.loads(result.stdout)
          files=[]
          for path in sorted(Path('build/screenshots').glob('*.png')):
              blob=api('git/blobs',{'content':base64.b64encode(path.read_bytes()).decode(),'encoding':'base64'})
              files.append({'path':path.name,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('git/trees',{'tree':files})
          commit=api('git/commits',{'message':'Verified phone screens','tree':tree['sha'],'parents':[os.environ['GITHUB_SHA']]})
          api('git/refs',{'ref':'refs/heads/screen-checks-'+os.environ['GITHUB_RUN_ID'],'sha':commit['sha']})
          PY
