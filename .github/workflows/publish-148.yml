name: Publish signed Android 1.4.8
# canonical signer republish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-148.yml
permissions:
  contents: write
concurrency:
  group: publish-android-1.4.8
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct verified signed APK
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd; }
          git fetch origin android-build-37486189357:refs/remotes/origin/android-build-37486189357
          git show origin/android-build-37486189357:unsigned.apk > /tmp/RgatuLite-unsigned.apk
          printf '%s  %s\n' 'db5bb929fba4d030dd12906dfdb3bb6d623b51f207db886f92d96564dbc038b7' /tmp/RgatuLite-unsigned.apk | sha256sum -c -
          cat .release/v1.4.8/patch.*.b64 | tr -d '\n' | base64 -d > /tmp/RgatuLite-1.4.8.zstpatch
          printf '%s  %s\n' '24b4d040ce3b404b4eb8787fe5bfa23104ccdbcb5f6285a2b25bc5aab8997e06' /tmp/RgatuLite-1.4.8.zstpatch | sha256sum -c -
          mkdir -p docs/download
          zstd -q -f -d --patch-from=/tmp/RgatuLite-unsigned.apk /tmp/RgatuLite-1.4.8.zstpatch -o docs/download/RgatuLite.apk
          printf '%s  %s\n' 'fe73b254469f4c9b19e68e58c370ddf472b0bb8332fbbd4662eeb9cec22775cf' docs/download/RgatuLite.apk | sha256sum -c -
          test "$(stat -c '%s' docs/download/RgatuLite.apk)" = "177392"

          git show origin/android-build-37486189357:apksigner.part0 > /tmp/apksigner.jar
          git show origin/android-build-37486189357:apksigner.part1 >> /tmp/apksigner.jar
          java -jar /tmp/apksigner.jar verify --verbose --print-certs docs/download/RgatuLite.apk | tee /tmp/apk-certs.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: 32dcd1f0d6ce4a50cad8c87a0d22fcc5d172aac77503ab966cb80dca546fa9f9' /tmp/apk-certs.txt

      - name: Prepare 1.4.8 release metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          version_path=Path('version.json')
          meta=json.loads(version_path.read_text(encoding='utf-8'))
          meta['version']='1.4.8'
          meta['versionCode']=17
          meta['released']='2026-10-06'
          meta['artifact']={
            'sha256':'fe73b254469f4c9b19e68e58c370ddf472b0bb8332fbbd4662eeb9cec22775cf',
            'bytes':177392,
          }
          meta['pwa']['cache']='rgatu-pairs-web-v1.4.8'
          version_path.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          releases_path=Path('releases.json')
          history=json.loads(releases_path.read_text(encoding='utf-8'))
          for row in history.get('public',[]):
              row['status']='superseded'
          history['public']=[{
              'version':'1.4.8',
              'versionCode':17,
              'date':'2026-10-06',
              'bytes':177392,
              'sha256':'fe73b254469f4c9b19e68e58c370ddf472b0bb8332fbbd4662eeb9cec22775cf',
              'status':'stable',
          }]+[row for row in history.get('public',[]) if row.get('version')!='1.4.8']
          history['current']='1.4.8'
          releases_path.write_text(json.dumps(history,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          Path('RELEASE_NOTES.md').write_text(
              'Расписание ФЗО 1.4.8\n\n'
              '- APK переподписан каноническим сертификатом RGATU Pairs, совпадающим с версиями 1.0.0 и 1.4.2.\n'
              '- Дамп расписания обновлён по файлу от 06.10.2026.\n'
              '- Для ЗКС-26 и ЗСС-26 «Основы российской государственности» перенесены с 8 октября, 4 пары, Г-523 на 10 октября, 7 пару, Г-302.\n'
              '- Исправлены контраст выбранного дня в тёмной теме и форма маркера дня с парами.\n',
              encoding='utf-8'
          )
          PY
          python3 scripts/versioning.py sync

      - name: Commit corrected Android 1.4.8
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/download/RgatuLite.apk             version.json package.json             android/AndroidManifest.xml             docs/version.json docs/index.html             public/sw.js             releases.json RELEASE_NOTES.md
          git diff --cached --quiet && exit 0
          git commit -m "release: republish Android 1.4.8 with canonical signer"
          git pull --rebase origin main
          git push origin HEAD:main
