name: App page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify release metadata and schedule logic
        run: |
          python3 scripts/versioning.py check
          node scripts/test_timetable.cjs
          python3 scripts/build_worker.py
          node --check dist/worker.mjs
          node scripts/test_integration_contract.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish app page
        id: deployment
        uses: actions/deploy-pages@v4
