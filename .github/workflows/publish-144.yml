name: Publish signed Android 1.4.4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-144.yml
permissions:
  contents: write
concurrency:
  group: publish-android-1.4.4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reconstruct verified signed APK
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd; }
          git fetch origin android-build-37418492204:refs/remotes/origin/android-build-37418492204
          git show origin/android-build-37418492204:unsigned.apk > /tmp/RgatuLite-unsigned.apk
          printf '%s  %s\n' 'e9922ddcb0acd38db004bcfee7ffef0a5c7dadd21dec120d2d56021fa81cd4c4' /tmp/RgatuLite-unsigned.apk | sha256sum -c -
          cat .release/v1.4.4/patch.*.b64 | tr -d '\n' | base64 -d > /tmp/RgatuLite-1.4.4.zstpatch
          printf '%s  %s\n' '1bc1541717fcece6a1f91aa69a9f0fc9d13e5001b658834b70d1d49f9a3176a9' /tmp/RgatuLite-1.4.4.zstpatch | sha256sum -c -
          mkdir -p docs/download
          zstd -q -d --patch-from=/tmp/RgatuLite-unsigned.apk /tmp/RgatuLite-1.4.4.zstpatch -o docs/download/RgatuLite.apk
          printf '%s  %s\n' '5e929f95c1ffc67ed8f93903f65799629d08d05eeff46fa76376101d27910392' docs/download/RgatuLite.apk | sha256sum -c -
          test "$(stat -c '%s' docs/download/RgatuLite.apk)" = "177392"
      - name: Update version metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/version.json')
          data={
            "version":"1.4.4",
            "versionCode":13,
            "updated":"2026-10-06",
            "download":"./download/RgatuLite.apk",
            "sha256":"5e929f95c1ffc67ed8f93903f65799629d08d05eeff46fa76376101d27910392",
            "bytes":177392,
            "pwa":"https://rgatu-lite.ivan-s-2001.workers.dev/"
          }
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit signed release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download/RgatuLite.apk docs/version.json
          git diff --cached --quiet && exit 0
          git commit -m "release: publish Android 1.4.4"
          git push origin HEAD:main
