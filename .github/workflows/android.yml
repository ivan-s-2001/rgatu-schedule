name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          sdk_root="$RUNNER_TEMP/rgatu-sdk"
          mkdir -p "$sdk_root"
          curl --retry 3 -fsSL https://dl.google.com/android/repository/platform-35_r02.zip -o "$sdk_root/platform.zip"
          curl --retry 3 -fsSL https://dl.google.com/android/repository/build-tools_r35.0.1_linux.zip -o "$sdk_root/buildtools.zip"
          printf '%s  %s\n' '0bb560a90a7a2cbd0dd8348224d518b638fe7949' "$sdk_root/platform.zip" | sha1sum -c -
          printf '%s  %s\n' 'e009a9b188cfeb1d2b4c318ab5cb4f1ddc368861' "$sdk_root/buildtools.zip" | sha1sum -c -
          unzip -q "$sdk_root/platform.zip" -d "$sdk_root/platform"
          unzip -q "$sdk_root/buildtools.zip" -d "$sdk_root/buildtools"
          printf 'ANDROID_JAR=%s\n' "$sdk_root/platform/android-35/android.jar" >> "$GITHUB_ENV"
          printf 'BUILD_TOOLS_DIR=%s\n' "$sdk_root/buildtools/android-15" >> "$GITHUB_ENV"
      - name: Check schedule and reminder times
        run: bash scripts/check.sh
      - name: Preserve development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/rgatu-schedule-debug.keystore
          key: rgatu-signing-v1-${{ github.repository_id }}
      - name: Build installable APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SCHEDULE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SCHEDULE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export SCHEDULE_DEBUG_KEYSTORE="$HOME/.android/rgatu-schedule-debug.keystore"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$SCHEDULE_KEYSTORE_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rgatu-signing.jks"
            export SCHEDULE_KEYSTORE="$RUNNER_TEMP/rgatu-signing.jks"
          fi
          bash scripts/build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rgatu-schedule-apk
          path: dist/rgatu-schedule.apk
          if-no-files-found: error
          retention-days: 30
