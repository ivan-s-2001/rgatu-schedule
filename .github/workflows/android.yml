name: Android build
on:
  push:
    branches: [main]
    paths:
      - android/**
      - public/**
      - scripts/build_android.py
      - .github/workflows/android.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          sdk_root="$RUNNER_TEMP/rgatu-sdk"
          mkdir -p "$sdk_root/platforms" "$sdk_root/build-tools"
          curl --retry 3 -fsSL https://dl.google.com/android/repository/platform-35_r02.zip -o "$sdk_root/platform.zip"
          curl --retry 3 -fsSL https://dl.google.com/android/repository/build-tools_r35.0.1_linux.zip -o "$sdk_root/buildtools.zip"
          printf '%s  %s\n' '0bb560a90a7a2cbd0dd8348224d518b638fe7949' "$sdk_root/platform.zip" | sha1sum -c -
          printf '%s  %s\n' 'e009a9b188cfeb1d2b4c318ab5cb4f1ddc368861' "$sdk_root/buildtools.zip" | sha1sum -c -
          unzip -q "$sdk_root/platform.zip" -d "$sdk_root/platforms"
          unzip -q "$sdk_root/buildtools.zip" -d "$sdk_root/build-tools"
          mv "$sdk_root/build-tools/android-15" "$sdk_root/build-tools/34.0.0"
          printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
      - name: Verify and build unsigned APK
        run: |
          node scripts/test_timetable.cjs
          python3 scripts/build_android.py --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: dist/RgatuLite-unsigned.apk
          retention-days: 7
      - name: Make build available for private signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          def api(endpoint,payload):
              response=subprocess.run(['gh','api','--method','POST',f'repos/{repo}/{endpoint}','--input','-'],input=json.dumps(payload),text=True,capture_output=True,check=True)
              return json.loads(response.stdout)
          blobs=[]
          files={'unsigned.apk':Path('dist/RgatuLite-unsigned.apk'),'apksigner.jar':Path(os.environ['ANDROID_SDK_ROOT'])/'build-tools/34.0.0/lib/apksigner.jar'}
          for name,path in files.items():
              blob=api('git/blobs',{'content':base64.b64encode(path.read_bytes()).decode(),'encoding':'base64'})
              blobs.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('git/trees',{'tree':blobs})
          commit=api('git/commits',{'message':'Unsigned Android build for private signing','tree':tree['sha'],'parents':[os.environ['GITHUB_SHA']]})
          branch='android-build-'+os.environ['GITHUB_RUN_ID']
          api('git/refs',{'ref':'refs/heads/'+branch,'sha':commit['sha']})
          print('Build branch:',branch)
          PY
