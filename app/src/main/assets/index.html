<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Мои пары</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 2v4m8-4v4M4 9h16M5 4h14a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M8 13h2m4 0h2m-8 4h2"/></svg></span><div><h1>Мои пары</h1><p id="group-label">ЗВС-26 · 1 курс</p></div></div>
      <button class="icon-button" id="settings-button" aria-label="Настройки"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 4 2 2 1 4 3 1 2 3 4-1 1-3 3-1 2-4-2-2-1-4-3-1-2-3Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </header>
    <main>
      <div id="preview-banner" hidden>Предпросмотр · уведомления работают в APK</div>
      <section id="next-lesson" aria-label="Ближайшая пара"></section>
      <button id="reminder-status" class="reminder-status"></button>
      <nav class="tabs" aria-label="Режим расписания">
        <button data-tab="day" class="active" aria-current="page">День</button>
        <button data-tab="all">Все дни</button>
        <button data-tab="bells">Звонки</button>
      </nav>
      <section id="day-panel">
        <div class="period-row"><h2 id="month-label">Октябрь 2026</h2><div class="period-actions"><button class="text-button" id="today-button">Сегодня</button><button class="icon-button small" id="calendar-button" aria-label="Выбрать дату"><svg viewBox="0 0 24 24"><path d="M8 2v4m8-4v4M4 9h16M5 4h14a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/></svg></button></div></div>
        <div id="day-strip" class="day-strip" aria-label="Даты занятий"></div>
        <div class="day-heading"><div><h2 id="day-title"></h2><p id="day-summary"></p></div><button class="icon-button add-button" id="add-button" aria-label="Добавить пару"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div id="timeline"></div>
      </section>
      <section id="all-panel" hidden>
        <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><input id="search" type="search" placeholder="Предмет, преподаватель, аудитория" aria-label="Поиск по расписанию"></label>
        <div id="all-days"></div>
      </section>
      <section id="bells-panel" hidden></section>
      <p class="source-note" id="source-note"></p>
    </main>
  </div>
  <div id="modal-overlay" class="modal-overlay" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div class="modal-header"><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div id="modal-content"></div>
    </section>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
